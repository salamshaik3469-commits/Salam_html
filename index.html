<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="TaskFlow - interactive client-side To-Do List using DOM manipulation, event delegation and localStorage.">
  <title>TaskFlow | JavaScript To-Do List</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app-shell">
    <section class="todo-card" aria-labelledby="appTitle">
      <header class="app-header">
        <div>
          <p class="eyebrow">JavaScript Logic &amp; State Management</p>
          <h1 id="appTitle">TaskFlow</h1>
          <p class="subtitle">A clean, persistent To-Do List built with vanilla JavaScript.</p>
        </div>
        <div class="stats" aria-label="Task statistics">
          <div class="stat"><strong id="totalCount">0</strong><span>Total</span></div>
          <div class="stat"><strong id="activeCount">0</strong><span>Active</span></div>
          <div class="stat"><strong id="completedCount">0</strong><span>Done</span></div>
        </div>
      </header>

      <form id="taskForm" class="task-form" novalidate>
        <label class="sr-only" for="taskInput">Task title</label>
        <input id="taskInput" type="text" maxlength="120" placeholder="What needs to be done?" autocomplete="off" required>
        <button id="submitButton" class="primary-button" type="submit">Add Task</button>
      </form>
      <p id="formError" class="form-error" role="alert" aria-live="assertive"></p>

      <div class="toolbar">
        <div class="filters" role="group" aria-label="Filter tasks">
          <button class="filter-button active" type="button" data-filter="all" aria-pressed="true">All</button>
          <button class="filter-button" type="button" data-filter="active" aria-pressed="false">Active</button>
          <button class="filter-button" type="button" data-filter="completed" aria-pressed="false">Completed</button>
        </div>
        <button id="clearCompleted" class="secondary-button" type="button">Clear completed</button>
      </div>

      <p id="statusMessage" class="status" role="status" aria-live="polite"></p>
      <ul id="taskList" class="task-list" aria-label="Task list"></ul>

      <div id="emptyState" class="empty-state" hidden>
        <div class="empty-icon" aria-hidden="true">✓</div>
        <h2 id="emptyTitle">No tasks yet</h2>
        <p id="emptyText">Add your first task above to get started.</p>
      </div>

      <footer class="app-footer">
        <span>Saved automatically in this browser</span>
        <span aria-hidden="true">•</span>
        <span id="taskCountLabel">0 tasks</span>
      </footer>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
